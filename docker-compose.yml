services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DB=speaker_recognition
      - ALLOWED_ORIGINS=http://localhost:4173,http://localhost:3000,http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      - mongo
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/trained_models:/app/trained_models

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "4173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
